version: '3'

services:
  camunda:
    image: camunda/camunda-bpm-platform:run-latest
    ports:
      - "8080:8080"
    volumes:
      # Here you map the folder where you save your .bpmn files
      - ../docs/diagrams/:/camunda/configuration/resources
    environment:
      - CAMUNDA_BPM_RUN_AUTH_ENABLED=false # disable login for convenience in dev