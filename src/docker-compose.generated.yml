networks:
  acme-network:
    driver: bridge
  bank-network:
    driver: bridge
  fleet-internal-network:
    driver: bridge
  orchestration-network:
    driver: bridge
  vehicle-network:
    driver: bridge
  vehicle-hw-network:
    driver: bridge
