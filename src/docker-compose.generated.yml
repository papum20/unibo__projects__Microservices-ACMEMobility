# templates

# Use dot prefix (.station-template) for templates so they don't create containers
x-station-template: &station-template
  build: ./service-stations
  image: acme-station:latest
  env_file:
  - .env
  networks:
    - acme-network
    - vehicle-hw-network
      
x-vehicle-template: &vehicle-template
  build: ./service-vehicle
  image: acme-vehicle:latest
  env_file:
  - .env
  depends_on:
    - graphhopper
  networks:
    - acme-network
    - vehicle-network
    - vehicle-hw-network
    

services:
  camunda:
    build: ./camunda
    container_name: acme-camunda
    environment:
      # these variables set the database to be in memory, so that it is reset every time
      # the container is restarted (useful so that all processes get cleaned and don't interfere)
      - DB_URL=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - DB_USERNAME=sa
      - DB_PASSWORD=
    ports:
      - "${PORT_LOCAL_CAMUNDA}:${PORT_CAMUNDA}"
    volumes:
      # Here you map the folder where you save your .bpmn files
      - ./camunda-resources-debug/:/camunda/configuration/resources
    networks:
      - orchestration-network

  acme-worker:
    build: ./service-acme-worker
    container_name: acme-worker
    env_file:
      - .env
    ports:
      - "${PORT_LOCAL_ACME}:${PORT_ACME}"
    depends_on:
      - camunda
    networks:
      - acme-network
      - bank-network
      - orchestration-network


  bank-service:
    build: ./service-bank
    networks:
      - bank-network


  fleet-service:
    image: nginx:latest
    container_name: fleet-service
    env_file:
      - .env
    ports:
      - "${PORT_LOCAL_FLEET}:${PORT_FLEET}"
    volumes:
      - ./service-fleet-management/nginx.generated.conf:/etc/nginx/nginx.conf:ro
      - ./service-fleet-visualizer:/usr/share/nginx/html/map:ro
    depends_on:
      - fleet-tracking
      - fleet-battery
    networks:
      - acme-network
      - fleet-internal-network
      - vehicle-network

  fleet-tracking:
    build: ./service-fleet-tracking
    container_name: fleet-tracking
    env_file:
      - .env
    networks:
      - fleet-internal-network
      - vehicle-network

  fleet-battery:
    build: ./service-fleet-battery
    container_name: fleet-battery
    env_file:
      - .env
    networks:
      - fleet-internal-network
      - vehicle-network


  graphhopper:
      image: israelhikingmap/graphhopper:latest
      container_name: acme-graphhopper
      ports:
        - "${PORT_LOCAL_GRAPHHOPPER}:${PORT_GRAPHHOPPER}"
      volumes:
        - ./service-graphhopper/data:/data
      command: --host 0.0.0.0 -i /data/${GRAPHHOPPER_MAP_FILE}
      networks:
        - vehicle-network


  # 5-10 stations

  station-bologna-01:
    # Merge all properties from station-template
    <<: *station-template
    container_name: acme-station-${STATION_SUFFIX_01}
    environment:
      - STATION_ID=${STATION_PREFIX}-${STATION_SUFFIX_01}
    ports:
      - "${PORT_LOCAL_STATION_01}:${PORT_STATIONS}"
  station-bologna-02:
    <<: *station-template
    container_name: acme-station-${STATION_SUFFIX_02}
    environment:
      - STATION_ID=${STATION_PREFIX}-${STATION_SUFFIX_02}
    ports:
      - "${PORT_LOCAL_STATION_02}:${PORT_STATIONS}"
  station-bologna-03:
    <<: *station-template
    container_name: acme-station-${STATION_SUFFIX_03}
    environment:
      - STATION_ID=${STATION_PREFIX}-${STATION_SUFFIX_03}
    ports:
      - "${PORT_LOCAL_STATION_03}:${PORT_STATIONS}"
  station-bologna-04:
    <<: *station-template
    container_name: acme-station-${STATION_SUFFIX_04}
    environment:
      - STATION_ID=${STATION_PREFIX}-${STATION_SUFFIX_04}
    ports:
      - "${PORT_LOCAL_STATION_04}:${PORT_STATIONS}"
  station-bologna-05:
    <<: *station-template
    container_name: acme-station-${STATION_SUFFIX_05}
    environment:
      - STATION_ID=${STATION_PREFIX}-${STATION_SUFFIX_05}
    ports:
      - "${PORT_LOCAL_STATION_05}:${PORT_STATIONS}"


  # 10 vehicles

  vehicle-01:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_01}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_01}
    ports:
      - "${PORT_LOCAL_VEHICLE_01}:${PORT_VEHICLES}"
  vehicle-02:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_02}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_02}
    ports:
      - "${PORT_LOCAL_VEHICLE_02}:${PORT_VEHICLES}"
  vehicle-03:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_03}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_03}
    ports:
      - "${PORT_LOCAL_VEHICLE_03}:${PORT_VEHICLES}"
  vehicle-04:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_04}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_04}
    ports:
      - "${PORT_LOCAL_VEHICLE_04}:${PORT_VEHICLES}"
  vehicle-05:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_05}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_05}
    ports:
      - "${PORT_LOCAL_VEHICLE_05}:${PORT_VEHICLES}"
  vehicle-06:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_06}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_06}
    ports:
      - "${PORT_LOCAL_VEHICLE_06}:${PORT_VEHICLES}"
  vehicle-07:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_07}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_07}
    ports:
      - "${PORT_LOCAL_VEHICLE_07}:${PORT_VEHICLES}"
  vehicle-08:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_08}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_08}
    ports:
      - "${PORT_LOCAL_VEHICLE_08}:${PORT_VEHICLES}"
  vehicle-09:
    <<: *vehicle-template
    container_name: acme-vehicle-${VEHICLE_SUFFIX_09}
    environment:
      - VEHICLE_ID=${VEHICLE_PREFIX}-${VEHICLE_SUFFIX_09}
    ports:
