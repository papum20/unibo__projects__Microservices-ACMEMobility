services:
  camunda:
    build: ./camunda
    container_name: acme-camunda
    ports:
      - "${DOLLAR}{PORT_LOCAL_CAMUNDA}:${DOLLAR}{PORT_CAMUNDA}"
    volumes:
      # Here you map the folder where you save your .bpmn files
      - ./camunda-resources/:/camunda/configuration/resources
    networks:
      - orchestration-network

  bank-service:
    build: ./service-bank
    networks:
      - bank-network

  acme-worker:
    build: ./service-acme-worker
    container_name: acme-worker
    env_file:
      - .env
    depends_on:
      - camunda
    networks:
      - acme-network
      - bank-network
      - orchestration-network

  # fleet:
  #   build: ./service-fleet-management
  #   networks:
  #     - acme-network


  # 5-10 stations

  # Use dot prefix (.station-template) for templates so they don't create containers
  .station-template: &station-template
    build: ./service-stations
    networks:
      - acme-network

  station-${STATION_SUFFIX_01}:
    # Merge all properties from station-template
    <<: *station-template
    container_name: acme-station-${DOLLAR}{STATION_SUFFIX_01}
  station-${STATION_SUFFIX_02}:
    <<: *station-template
    container_name: acme-station-${DOLLAR}{STATION_SUFFIX_02}
  station-${STATION_SUFFIX_03}:
    <<: *station-template
    container_name: acme-station-${DOLLAR}{STATION_SUFFIX_03}
  station-${STATION_SUFFIX_04}:
    <<: *station-template
    container_name: acme-station-${DOLLAR}{STATION_SUFFIX_04}
  station-${STATION_SUFFIX_05}:
    <<: *station-template
    container_name: acme-station-${DOLLAR}{STATION_SUFFIX_05}


  graphhopper:
      image: graphhopper/graphhopper:latest
      container_name: acme-graphhopper
      ports:
        - "${DOLLAR}{PORT_LOCAL_GRAPHHOPPER}:${DOLLAR}{PORT_GRAPHHOPPER}"
      volumes:
        - ./graphhopper/data:/data
      command: --host 0.0.0.0 -i /${DOLLAR}{GRAPHHOPPER_MAP_DIR}/${DOLLAR}{GRAPHHOPPER_MAP_FILE}
      networks:
        - integration-net

networks:
  acme-network:
    driver: bridge
  bank-network:
    driver: bridge
  fleet-internal-network:
    driver: bridge
  orchestration-network:
    driver: bridge
