services:
  camunda:
    build: ./camunda
    container_name: acme-camunda
    ports:
      - "${PORT_CAMUNDA}:8080"
    volumes:
      # Here you map the folder where you save your .bpmn files
      - ./camunda-resources/:/camunda/configuration/resources
    environment:
      - CAMUNDA_BPM_RUN_AUTH_ENABLED=false # disable login for convenience in dev
      #- CAMUNDA_BPM_GENERIC_PROPERTIES_GENERAL_ENFORCE-HISTORY-TIME-TO-LIVE=false
      #- enforceHistoryTimeToLive=false
      # disable example demo invoice app
      - CAMUNDA_BPM_RUN_EXAMPLE_INVOICE_ENABLED=false
      - CAMUNDA_BPM_RUN_WELCOME_APP_ENABLED=false
    networks:
      - orchestration-network

# fleet:
#   build: ./service-fleet-management
#   networks:
#     - acme-network

  bank-service:
    build: ./service-bank
    networks:
      - bank-network

  acme-worker:
    build: ./service-acme-worker
    container_name: acme-worker
    env_file:
      - .env
    depends_on:
      - camunda
    networks:
      - acme-network
      - bank-network
      - orchestration-network


networks:
  acme-network:
    driver: bridge
  bank-network:
    driver: bridge
  orchestration-network:
    driver: bridge
