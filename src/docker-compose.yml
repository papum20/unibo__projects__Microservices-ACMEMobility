services:
  camunda:
    image: camunda/camunda-bpm-platform:run-latest
    container_name: acme-camunda
    ports:
      - "${CAMUNDA_PORT}:8080"
    volumes:
      # Here you map the folder where you save your .bpmn files
      - ./camunda-resources/:/camunda/configuration/resources
    environment:
      - CAMUNDA_BPM_RUN_AUTH_ENABLED=false # disable login for convenience in dev
      #- CAMUNDA_BPM_GENERIC_PROPERTIES_GENERAL_ENFORCE-HISTORY-TIME-TO-LIVE=false
      #- enforceHistoryTimeToLive=false
    networks:
      - acme-network

# fleet:
#   build: ./service-fleet-management
#   networks:
#     - acme-network

#  bank:
#    build: ./service-bank


networks:
  acme-network:
    driver: bridge